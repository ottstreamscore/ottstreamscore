name: Notify webhook on main

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send signed webhook (GitHub-compatible)
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
        run: |
          payload='{"after":"${{ github.sha }}","ref":"${{ github.ref }}","pusher":{"name":"github-actions"}}'

          signature=$(echo -n "$payload" | \
            openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | \
            sed 's/^.* //')

          curl -sS -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: sha256=$signature" \
            --data-binary "$payload"
